# CLI checks: lint and the pytest suite on every Python version the package supports.
# Runs in the lab and, mirrored by tools/publish_cli.py, in the public Modkeel/modkeel repo,
# so it needs no secrets and only reads the repository.
name: cli

on:
  push:
    branches: [main]
    paths:
      - "modkeel/**"
      - "tests/**"
      - "mod_auto_compiler.py"
      - "pyproject.toml"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "modkeel/**"
      - "tests/**"
      - "mod_auto_compiler.py"
      - "pyproject.toml"
      - ".github/workflows/cli.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check modkeel tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q
