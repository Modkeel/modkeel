[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modkeel"
dynamic = ["version"]
description = "Minecraft Mod Auto-Compiler - find, compile, and verify unofficial mod forks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Modkeel" },
]
keywords = ["minecraft", "mods", "compiler", "neoforge", "fabric", "forge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "requests>=2.31.0",
    "toml>=0.10.2",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Contributor tooling: `pip install -e ".[dev]"`. CI installs the same set.
dev = [
    "pytest>=8.0",
    "ruff>=0.15,<0.17",
]

[project.scripts]
modkeel = "modkeel.cli:app"

[tool.hatch.version]
path = "modkeel/constants.py"
pattern = 'MODKEEL_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["modkeel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint the CLI package and its tests. The deprecated shim (mod_auto_compiler.py) only re-exports
# names for old callers, so it is left out. Line length is the project's 100.
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["mod_auto_compiler.py"]

# Pyflakes + the E4/E7/E9 pycodestyle subset: real bugs, not formatting. Listed explicitly
# because ruff's default set changes between releases (0.16 added RUF/FURB/PL rules), and CI
# must not go red on a ruff upgrade alone. Widen it on purpose, with the fixes in the same PR.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
