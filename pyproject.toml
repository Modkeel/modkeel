[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modkeel"
dynamic = ["version"]
description = "Minecraft Mod Auto-Compiler - find, compile, and verify unofficial mod forks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Modkeel" },
]
keywords = ["minecraft", "mods", "compiler", "neoforge", "fabric", "forge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "requests>=2.31.0",
    "toml>=0.10.2",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
modkeel = "modkeel.cli:app"

[tool.hatch.version]
path = "modkeel/constants.py"
pattern = 'MODKEEL_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["modkeel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
